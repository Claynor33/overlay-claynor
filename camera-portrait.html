<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caméra portrait</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{ --plat:#e8f4ff; --plat-deep:#9fb4c6; --pglow:rgba(232,244,255,.5);
         --cyan:#2de2e6; --cyan-deep:#0fa3b1; --ink:#eaf6f7; --ink-dim:#6f858c; --line:rgba(45,226,230,.28);
         --gold:#cd7f32; --gold-deep:#7d4a1c; --glow:rgba(205,127,50,.45);
         --dlc:#a970ff; --tc:#e8f4ff; --td:#9fb4c6; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:transparent; font-family:'Rajdhani',sans-serif; color:var(--ink); }
  #scene{ position:absolute; inset:0; perspective:1100px; }

  /* ---------- contour de progression (épouse le rectangle arrondi) ---------- */
  #ring{ position:absolute; transform:translate(-50%,-50%); overflow:visible; }
  #ring rect{ fill:none; }
  .r-bg{ stroke:rgba(255,255,255,.08); }
  .r-in{ stroke:var(--cyan); opacity:.28; }
  .r-fill{ stroke:var(--gold); stroke-linecap:round; filter:drop-shadow(0 0 7px var(--glow)); transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1), stroke .5s ease; }
  .r-dlc{ stroke:rgba(169,112,255,.55); stroke-linecap:butt; }
  .r-mk{ stroke:#e2f0ff; stroke-width:3; stroke-linecap:round; filter:drop-shadow(0 0 6px #cfe6ff); }
  .r-mkd{ fill:#eaf6ff; filter:drop-shadow(0 0 6px #cfe6ff); }
  .r-dlc,.r-mk,.r-mkd{ display:none; }

  /* ---------- pastilles ---------- */
  .pill{ position:absolute; display:flex; align-items:center; gap:7px; height:26px; padding:0 13px;
    background:linear-gradient(105deg, rgba(10,15,19,.94), rgba(10,15,19,.7));
    border:1px solid var(--line); border-radius:14px; transform:translate(-50%,-50%); white-space:nowrap; z-index:6; }
  .pill .live{ width:6px; height:6px; border-radius:50%; background:#ff4d4d; box-shadow:0 0 8px #ff4d4d; animation:blink 1.4s ease-in-out infinite; }
  .pill .txt{ font-family:'Chakra Petch'; font-weight:700; font-size:11px; letter-spacing:.24em; color:var(--cyan); text-transform:uppercase; }
  .pill .eye{ width:14px; height:14px; color:var(--cyan); display:inline-flex; filter:drop-shadow(0 0 6px var(--cyan)); }
  .pill .eye svg{ width:100%; height:100%; }
  .pill .num{ font-family:'Chakra Petch'; font-weight:700; font-size:14px; line-height:1; color:var(--ink); font-variant-numeric:tabular-nums; }
  .pill .num.bump{ animation:bump .5s cubic-bezier(.2,1.4,.3,1); }
  #vw{ opacity:0; transition:opacity .35s ease; } #vw.on{ opacity:1; }
  #pl .tico{ width:15px; height:15px; display:inline-flex; filter:drop-shadow(0 0 6px var(--pglow)); }
  #pl .tico svg{ width:100%; height:100%; }
  #pl .tico .lt{ fill:var(--plat); stroke:var(--plat); } #pl .tico .dk{ fill:var(--plat-deep); }
  #pl .num{ color:var(--plat); text-shadow:0 0 10px var(--pglow); }
  #pl.vol{ opacity:0; }

  /* ---------- bloc jeu + trophées (sous la carte) ---------- */
  #infos{ position:absolute; transform:translate(-50%,0); text-align:center; z-index:5; width:440px; }
  .jeu{ font-family:'Chakra Petch'; font-weight:700; font-size:22px; letter-spacing:.04em; color:var(--ink); text-transform:uppercase; text-shadow:0 0 16px rgba(45,226,230,.25); overflow:hidden; white-space:nowrap; }
  .jeu>span{ display:inline-block; }
  .tro{ display:flex; align-items:center; justify-content:center; gap:9px; margin-top:5px; position:relative; }
  .tro .ico{ width:22px; height:22px; display:inline-flex; filter:drop-shadow(0 0 7px var(--glow)); }
  .tro .ico svg{ width:100%; height:100%; }
  .tro .ico .lt{ fill:var(--gold); stroke:var(--gold); } .tro .ico .dk{ fill:var(--gold-deep); }
  .tro .c{ font-family:'Chakra Petch'; font-weight:700; font-size:22px; color:var(--gold); text-shadow:0 0 14px var(--glow); font-variant-numeric:tabular-nums; }
  .tro .c.pop{ animation:pop .55s cubic-bezier(.2,1.4,.3,1); }
  .tro .s{ font-size:15px; color:var(--ink-dim); font-family:'Chakra Petch'; font-weight:700; }
  .tro .p{ font-family:'Rajdhani'; font-weight:700; font-size:12px; letter-spacing:.16em; color:var(--gold); margin-left:4px; }

  /* ---------- panneau de réglages ---------- */
  #ctrl{ position:absolute; left:8px; top:8px; z-index:60; display:flex; flex-direction:column; gap:7px; padding:12px 14px;
    background:rgba(6,11,14,.97); border:1px solid var(--line); border-radius:10px; opacity:0; pointer-events:none; transition:opacity .18s ease; }
  #ctrl.show{ opacity:1; pointer-events:auto; }
  #ctrl .ct{ font-family:'Chakra Petch'; font-weight:700; font-size:10px; letter-spacing:.26em; color:var(--cyan); text-transform:uppercase; text-align:center; }
  #ctrl .row{ display:flex; align-items:center; gap:7px; }
  #ctrl .lb{ width:64px; font-weight:700; font-size:11px; letter-spacing:.08em; color:var(--ink-dim); text-transform:uppercase; }
  #ctrl button{ min-width:30px; height:30px; padding:0 9px; cursor:pointer; font-family:'Chakra Petch'; font-weight:700; font-size:14px; color:var(--ink); background:rgba(45,226,230,.10); border:1px solid var(--line); border-radius:6px; }
  #ctrl button:hover{ background:var(--cyan); color:#04252a; }
  #ctrl .vv{ min-width:52px; text-align:center; font-family:'Chakra Petch'; font-weight:700; font-size:15px; color:var(--gold); }
  #ctrl .vv.pt{ color:var(--plat); }
  #ctrl input{ flex:1; width:110px; height:30px; padding:0 9px; font-family:'Rajdhani'; font-weight:600; font-size:13px; color:var(--ink); background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:6px; text-transform:uppercase; }
  #ctrl input:focus{ outline:none; border-color:var(--cyan); }

  /* ---------- animation d'alerte ---------- */
  #fly{ position:absolute; width:24px; height:24px; z-index:20; opacity:0; transform-style:preserve-3d; pointer-events:none; filter:drop-shadow(0 0 14px var(--tc)); }
  #fly svg{ width:100%; height:100%; }
  #fly .lt{ fill:var(--tc); stroke:var(--tc); } #fly .dk{ fill:var(--td); }
  #halo{ position:absolute; width:230px; height:230px; border-radius:50%; z-index:19; opacity:0; pointer-events:none; background:radial-gradient(circle, var(--tc) 0%, transparent 62%); }
  #flyname{ position:absolute; z-index:21; opacity:0; pointer-events:none; text-align:center; white-space:nowrap; transform:translate(-50%,-50%); }
  #flyname .k{ font-family:'Chakra Petch'; font-weight:700; font-size:13px; letter-spacing:.34em; color:var(--tc); text-transform:uppercase; text-shadow:0 0 14px var(--tc); }
  #flyname .p{ font-family:'Chakra Petch'; font-weight:700; font-size:30px; letter-spacing:.05em; color:var(--ink); text-transform:uppercase; text-shadow:0 0 20px var(--tc); margin-top:3px; }
  #flyname .l{ height:2px; margin:7px auto 0; width:70%; background:linear-gradient(90deg,transparent,var(--tc),transparent); box-shadow:0 0 10px var(--tc); }
  .spark{ position:absolute; width:7px; height:7px; background:var(--tc); box-shadow:0 0 9px var(--tc); border-radius:2px; z-index:18; pointer-events:none; }

  /* repère caméra (invisible en OBS) */
  #hole{ position:absolute; transform:translate(-50%,-50%); border:1px dashed rgba(111,133,140,.35); display:none; }
  body.preview #hole{ display:block; background:radial-gradient(circle at 50% 40%, rgba(20,30,36,.6), rgba(10,15,19,.28)); }
  body.preview #holetxt{ position:absolute; transform:translate(-50%,-50%); font-family:'Chakra Petch'; letter-spacing:.4em; font-size:14px; color:rgba(111,133,140,.5); text-transform:uppercase; }
  body:not(.preview) #holetxt{ display:none; }

  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.28)}100%{transform:scale(1)}}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){ .live{animation:none} }
</style>
</head>
<body class="preview">
  <div id="scene">
    <div id="hole"></div><div id="holetxt">Caméra</div>
    <svg id="ring"><rect class="r-bg"/><rect class="r-in"/><rect class="r-dlc"/><rect class="r-fill"/><line class="r-mk" id="rMk"/><circle class="r-mkd" id="rMkd"/></svg>

    <div class="pill" id="nm"><span class="live"></span><span class="txt" id="lbl">CLAYNOR</span></div>
    <div class="pill" id="vw"><span class="eye"></span><span class="num" id="vn">0</span></div>
    <div class="pill" id="pl"><span class="tico"></span><span class="num" id="pn">0</span></div>

    <div id="infos">
      <div class="jeu" id="jeu"><span>CRYSIS</span></div>
      <div class="tro"><span class="ico"></span><span class="c" id="tg">0</span><span class="s">/</span><span class="s" id="tt">41</span><span class="p" id="tp">0 %</span></div>
    </div>

    <div id="ctrl">
      <div class="ct">Réglages</div>
      <div class="row"><span class="lb">Trophées</span><button data-a="tm">−</button><span class="vv"><span id="cG">0</span>/<span id="cT">0</span></span><button data-a="tp">+</button></div>
      <div class="row"><span class="lb">Total</span><button data-a="om">−</button><span class="vv" id="cT2">0</span><button data-a="op">+</button></div>
      <div class="row"><span class="lb">Platine à</span><button data-a="lm">−</button><span class="vv" id="cL">0</span><button data-a="lp">+</button></div>
      <div class="row"><span class="lb">Platines</span><button data-a="pm">−</button><span class="vv pt" id="cP">0</span><button data-a="pp">+</button></div>
      <div class="row"><span class="lb">Jeu</span><input id="cGame" placeholder="Nom du jeu"><button data-a="gk">OK</button></div>
    </div>

    <div id="halo"></div><div id="fly"></div>
    <div id="flyname"><div class="k" id="fk">Nouveau follow</div><div class="p" id="fp">PSEUDO</div><div class="l"></div></div>
  </div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const CONFIG={
  apercu:false,                 // true = repère visible · false = OBS
  label:"CLAYNOR",
  accent:"#2de2e6",
  twitch:"claynor",
  refresh:20,

  /* carte caméra : format portrait aux coins arrondis (comme la capture) */
  carte:{ largeur:200, hauteur:268, rayon:31, marge:105 },
  anneau:{ epaisseur:9, ecart:9 },

  infos:{ actif:true },
  platines:{ actif:true, depart:0, auto:true },
  remote:{ actif:true, room:"claynor-hud-x7k2", broker:"wss://broker.hivemq.com:8884/mqtt" },
  alerte:{
    actif:true, son:true, duree:3.4, vol:1.2,
    streamlabs:{ token:"" },
    evenements:{ follow:true, sub:true, don:true, raid:true, bits:true }
  }
};

const TIERS=[
  { max:25,  c:"#cd7f32", d:"#7d4a1c", g:"rgba(205,127,50,.45)" },
  { max:50,  c:"#c9d4de", d:"#7d8a97", g:"rgba(201,212,222,.45)" },
  { max:75,  c:"#f5c542", d:"#c8951f", g:"rgba(245,197,66,.45)" },
  { max:100, c:"#b9f2ff", d:"#4fa9c4", g:"rgba(185,242,255,.5)"  },
  { max:101, c:"#e8f4ff", d:"#9fb4c6", g:"rgba(232,244,255,.55)" }
];
function tierFor(p,complet){ if(complet) return TIERS[4]; for(const t of TIERS){ if(p<t.max) return t; } return TIERS[3]; }
const NIV={
  follow :{ c:"#cd7f32", d:"#7d4a1c", k:"Nouveau follow", s:1 },
  don    :{ c:"#c9d4de", d:"#7d8a97", k:"Don",            s:2 },
  resub  :{ c:"#f5c542", d:"#c8951f", k:"Resub",          s:3 },
  sub    :{ c:"#b9f2ff", d:"#4fa9c4", k:"Nouveau sub",    s:4 },
  gift   :{ c:"#e8f4ff", d:"#9fb4c6", k:"Sub offert",     s:5 },
  raid   :{ c:"#ff8a3d", d:"#a8501a", k:"Raid !",         s:4 },
  bits   :{ c:"#a970ff", d:"#5c30a8", k:"Bits",           s:4 }
};
const TROPHY='<svg viewBox="0 0 24 24" fill="none"><path class="lt" d="M6 4h12v3a6 6 0 0 1-12 0V4Z"/><path class="lt" d="M18 4h3v2a3 3 0 0 1-3 3M6 4H3v2a3 3 0 0 0 3 3" stroke-width="1.6" stroke-linecap="round" fill="none"/><path class="dk" d="M10 13h4v3h-4z"/><path class="lt" d="M8 19h8v1.5H8z"/><path class="dk" d="M9.5 16.5h5V19h-5z"/></svg>';

/* =====================================================================
   GÉOMÉTRIE (rectangle arrondi + contour)
   ===================================================================== */
const CW=CONFIG.carte.largeur, CH=CONFIG.carte.hauteur, RAD=CONFIG.carte.rayon, M=CONFIG.carte.marge;
const CX=M+CW/2, CY=M+CH/2;                       // centre de la carte
const EC=CONFIG.anneau.ecart, EP=CONFIG.anneau.epaisseur;
// rectangle du contour (autour de la carte)
const RW=CW+EC*2, RH=CH+EC*2, RR=RAD+EC;          // largeur/hauteur/rayon du tracé
// périmètre d'un rectangle arrondi
const PERIM = 2*(RW-2*RR) + 2*(RH-2*RR) + 2*Math.PI*RR;
document.body.classList.toggle('preview', CONFIG.apercu);

(function place(){
  const h=document.getElementById('hole');
  h.style.width=CW+'px'; h.style.height=CH+'px'; h.style.left=CX+'px'; h.style.top=CY+'px'; h.style.borderRadius=RAD+'px';
  document.getElementById('holetxt').style.left=CX+'px'; document.getElementById('holetxt').style.top=CY+'px';

  const pad=26, S_W=RW+pad*2, S_H=RH+pad*2, ring=document.getElementById('ring');
  ring.setAttribute('width',S_W); ring.setAttribute('height',S_H); ring.setAttribute('viewBox','0 0 '+S_W+' '+S_H);
  ring.style.left=CX+'px'; ring.style.top=CY+'px';
  ring.querySelectorAll('rect').forEach(el=>{
    el.setAttribute('x',pad); el.setAttribute('y',pad); el.setAttribute('width',RW); el.setAttribute('height',RH);
    el.setAttribute('rx',RR); el.setAttribute('ry',RR);
  });
  ring.querySelector('.r-bg').setAttribute('stroke-width',EP);
  ring.querySelector('.r-in').setAttribute('stroke-width',1.5);
  const f=ring.querySelector('.r-fill'); f.setAttribute('stroke-width',EP);
  const dl=ring.querySelector('.r-dlc'); dl.setAttribute('stroke-width',EP); dl.style.strokeDasharray='0 '+PERIM;
  /* départ du remplissage : haut-centre, sens horaire.
     décalage = distance du coin haut-gauche (début natif du tracé rect) au milieu haut */
  f.style.strokeDasharray=PERIM; f.style.strokeDashoffset=PERIM;
  window.__perim=PERIM; window.__pad=pad;

  // pastilles autour de la carte
  const T=CY-CH/2, B=CY+CH/2, L=CX-CW/2, R=CX+CW/2;
  const nm=document.getElementById('nm'); nm.style.left=CX+'px'; nm.style.top=(B+EC+4)+'px';        // pseudo : bas centre
  const vw=document.getElementById('vw'); vw.style.left=(R-6)+'px'; vw.style.top=(T-EC-2)+'px';      // viewers : haut droite
  const pl=document.getElementById('pl'); pl.style.left=(L+6)+'px'; pl.style.top=(T-EC-2)+'px';      // platines : haut gauche

  const inf=document.getElementById('infos');
  inf.style.left=CX+'px'; inf.style.top=(B+EC+30)+'px';
  inf.style.display=CONFIG.infos.actif?'':'none';
})();

document.getElementById('lbl').textContent=CONFIG.label;
document.querySelector('#vw .eye').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5C6.5 5 2.2 8.6 1 12c1.2 3.4 5.5 7 11 7s9.8-3.6 11-7c-1.2-3.4-5.5-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-2.2a2.3 2.3 0 1 0 0-4.6 2.3 2.3 0 0 0 0 4.6z"/></svg>';
document.querySelector('#pl .tico').innerHTML=TROPHY;
document.querySelector('.tro .ico').innerHTML=TROPHY;
document.getElementById('fly').innerHTML=TROPHY;

function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const f=amt<0?0:255,t=Math.abs(amt);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function setAccent(a){ document.documentElement.style.setProperty('--cyan',a); document.documentElement.style.setProperty('--cyan-deep',shade(a,-0.4)); }

/* =====================================================================
   ÉTAT (mêmes données que "Jeu & trophées")
   ===================================================================== */
const SKEY='hud_shared_v1', K='wJT_v1';
function readShared(){ try{const r=localStorage.getItem(SKEY);return r?JSON.parse(r):null;}catch(e){return null;} }
function loadS(){ try{const r=localStorage.getItem(K);return r?JSON.parse(r):null;}catch(e){return null;} }
function saveS(){ try{localStorage.setItem(K,JSON.stringify(state));}catch(e){} }
function loadP(){ try{const r=localStorage.getItem(K+'_p');return r?JSON.parse(r):{};}catch(e){return {};} }
function saveP(){ try{localStorage.setItem(K+'_p',JSON.stringify(profils));}catch(e){} }

let state=loadS()||{ jeu:{nom:"CRYSIS"}, trophees:{obtenus:0,total:41} };
if(state.trophees.platine==null) state.trophees.platine=0;
let profils=loadP(), prevGot=null, lastV=0;
let bcHud=null; try{ bcHud=new BroadcastChannel('hud-claynor'); }catch(e){}

function accentGlobal(){ const S=state.trophees, e=S.total?(S.obtenus/S.total*100):0; return tierFor(e, S.total>0&&S.obtenus>=S.total).c; }
function publish(){
  const s=readShared()||{};
  s.jeu=state.jeu.nom; s.accent=accentGlobal();
  s.trophees={obtenus:state.trophees.obtenus,total:state.trophees.total,platine:state.trophees.platine||0};
  s.v=Date.now(); lastV=s.v;
  try{ localStorage.setItem(SKEY,JSON.stringify(s)); }catch(e){}
  try{ bcHud&&bcHud.postMessage({kind:'state',s}); }catch(e){}
  pubRemote();
}
function fireCelebrate(){ const p={got:state.trophees.obtenus,total:state.trophees.total,ts:Date.now()};
  try{ bcHud&&bcHud.postMessage(Object.assign({kind:'trophy'},p)); }catch(e){}
  try{ localStorage.setItem('hud_celebrate',JSON.stringify(p)); }catch(e){} }

function render(anim){
  const got=state.trophees.obtenus, tot=state.trophees.total, plat=state.trophees.platine||0;
  const pct=tot?Math.round(got/tot*100):0;
  const t=tierFor(tot?(got/tot*100):0, tot>0&&got>=tot);
  const rs=document.documentElement.style; rs.setProperty('--gold',t.c); rs.setProperty('--gold-deep',t.d); rs.setProperty('--glow',t.g);
  setAccent(accentGlobal());

  document.querySelector('#jeu span').textContent=state.jeu.nom;
  document.getElementById('tt').textContent=tot;
  document.getElementById('tp').textContent=pct+' %';
  const el=document.getElementById('tg'); el.textContent=got;
  if(anim && prevGot!==null && got>prevGot){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
  prevGot=got;

  const P=window.__perim;
  const f=document.querySelector('.r-fill');
  f.style.strokeDashoffset = P*(1-Math.max(0,Math.min(1, tot?got/tot:0)));

  /* zone DLC + repère platine sur le contour */
  const rdlc=document.querySelector('.r-dlc'), mk=document.getElementById('rMk'), mkd=document.getElementById('rMkd');
  if(rdlc&&mk&&mkd){
    if(plat>0 && plat<tot){
      const pf=plat/tot;
      rdlc.style.strokeDasharray=((1-pf)*P)+' '+P;
      rdlc.style.strokeDashoffset=-pf*P;
      rdlc.style.display='block';
      const pt=pointOnRect(pf), nrm=normalOnRect(pf), pad=window.__pad;
      mk.setAttribute('x1',(pt.x-nrm.x*(EP/2+4)).toFixed(1)); mk.setAttribute('y1',(pt.y-nrm.y*(EP/2+4)).toFixed(1));
      mk.setAttribute('x2',(pt.x+nrm.x*(EP/2+4)).toFixed(1)); mk.setAttribute('y2',(pt.y+nrm.y*(EP/2+4)).toFixed(1));
      mk.style.display='block';
      mkd.setAttribute('cx',pt.x.toFixed(1)); mkd.setAttribute('cy',pt.y.toFixed(1)); mkd.setAttribute('r',3.4); mkd.style.display='block';
    } else { rdlc.style.display='none'; mk.style.display='none'; mkd.style.display='none'; }
  }

  document.getElementById('cG').textContent=got;
  document.getElementById('cT').textContent=tot;
  document.getElementById('cT2').textContent=tot;
  document.getElementById('cL').textContent=plat;
  fitJeu();
}
/* position sur le contour à la fraction f — même origine que le remplissage SVG :
   départ (x+r, y), sens horaire */
function pointOnRect(f){
  const x0=window.__pad, y0=window.__pad, w=RW, h=RH, r=RR;
  const sw=w-2*r, sh=h-2*r, arc=Math.PI*r/2;
  let d=((f%1)+1)%1*PERIM;
  if(d<=sw) return {x:x0+r+d, y:y0}; d-=sw;
  if(d<=arc){ const a=-Math.PI/2+d/r; return {x:x0+w-r+Math.cos(a)*r, y:y0+r+Math.sin(a)*r}; } d-=arc;
  if(d<=sh) return {x:x0+w, y:y0+r+d}; d-=sh;
  if(d<=arc){ const a=d/r; return {x:x0+w-r+Math.cos(a)*r, y:y0+h-r+Math.sin(a)*r}; } d-=arc;
  if(d<=sw) return {x:x0+w-r-d, y:y0+h}; d-=sw;
  if(d<=arc){ const a=Math.PI/2+d/r; return {x:x0+r+Math.cos(a)*r, y:y0+h-r+Math.sin(a)*r}; } d-=arc;
  if(d<=sh) return {x:x0, y:y0+h-r-d}; d-=sh;
  { const a=Math.PI+d/r; return {x:x0+r+Math.cos(a)*r, y:y0+r+Math.sin(a)*r}; }
}
function normalOnRect(f){ const e=0.0009, a=pointOnRect((f-e+1)%1), b=pointOnRect((f+e)%1);
  let tx=b.x-a.x, ty=b.y-a.y; const L=Math.hypot(tx,ty)||1; tx/=L; ty/=L; return {x:ty, y:-tx}; } // normale = perpendiculaire à la tangente
function fitJeu(){ const box=document.getElementById('jeu'), inner=box.firstElementChild; if(!inner) return;
  box.style.fontSize=''; let s=22, guard=0; while(inner.scrollWidth>box.clientWidth && s>13 && guard++<30){ s--; box.style.fontSize=s+'px'; } }

function saveCur(){ profils[state.jeu.nom]={obtenus:state.trophees.obtenus,total:state.trophees.total,platine:state.trophees.platine||0}; saveP(); }
function commit(){ saveCur(); saveS(); render(true); publish(); }
function changeGame(n){ n=(n||'').trim(); if(!n||n===state.jeu.nom) return; saveCur();
  const p=profils[n]||{obtenus:0,total:state.trophees.total,platine:0};
  state.jeu.nom=n; state.trophees.obtenus=p.obtenus; state.trophees.total=p.total; state.trophees.platine=p.platine||0;
  profils[n]={...p}; saveP(); saveS(); prevGot=state.trophees.obtenus; render(false); syncInputs(); publish(); }
function syncInputs(){ const i=document.getElementById('cGame'); if(i) i.value=state.jeu.nom; }
function adopt(s){ if(!s) return;
  if(s.jeu!==undefined) state.jeu.nom=s.jeu;
  if(s.trophees){ state.trophees.obtenus=s.trophees.obtenus; state.trophees.total=s.trophees.total; if(s.trophees.platine!==undefined) state.trophees.platine=s.trophees.platine; }
  saveS(); render(true); syncInputs(); }
(function(){ const s0=readShared(); if(s0){ lastV=s0.v||0; adopt(s0); }
  if(bcHud) bcHud.addEventListener('message',ev=>{ if(ev.data&&ev.data.kind==='state'&&(ev.data.s.v||0)>lastV){ lastV=ev.data.s.v; adopt(ev.data.s); } });
  setInterval(()=>{ const s=readShared(); if(s&&(s.v||0)>lastV){ lastV=s.v; adopt(s); } },400);
})();

/* panneau */
document.getElementById('ctrl').addEventListener('click',e=>{ const a=e.target.getAttribute('data-a'); if(!a) return; const S=state.trophees;
  if(a==='tp'){ S.obtenus=Math.min(S.obtenus+1,S.total); commit(); fireCelebrate(); }
  if(a==='tm'){ S.obtenus=Math.max(S.obtenus-1,0); commit(); }
  if(a==='op'){ S.total++; commit(); }
  if(a==='om'){ S.total=Math.max(S.total-1,S.obtenus); commit(); }
  if(a==='lp'){ S.platine=Math.min((S.platine||0)+1,S.total); commit(); }
  if(a==='lm'){ S.platine=Math.max((S.platine||0)-1,0); commit(); }
  if(a==='pp'){ psetP(pdata.n+1); }
  if(a==='pm'){ psetP(pdata.n-1); }
  if(a==='gk'){ changeGame(document.getElementById('cGame').value); }
});
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; const S=state.trophees;
  if(e.key==='+'||e.key==='ArrowUp'){ S.obtenus=Math.min(S.obtenus+1,S.total); commit(); fireCelebrate(); }
  if(e.key==='-'||e.key==='ArrowDown'){ S.obtenus=Math.max(S.obtenus-1,0); commit(); } });
const ctrl=document.getElementById('ctrl'); let hideT;
function wake(){ ctrl.classList.add('show'); clearTimeout(hideT); hideT=setTimeout(()=>ctrl.classList.remove('show'),3500); }
document.addEventListener('mousemove',wake); document.addEventListener('click',wake);

/* télécommande */
let mcli=null;
function pubRemote(){ try{ mcli&&mcli.publish('claynor/'+CONFIG.remote.room+'/state', JSON.stringify({jeu:state.jeu.nom,got:state.trophees.obtenus,total:state.trophees.total}),{retain:true}); }catch(e){} }
(function(){ if(!CONFIG.remote.actif) return; const s=document.createElement('script'); s.src='https://unpkg.com/mqtt/dist/mqtt.min.js';
  s.onload=function(){ try{ mcli=mqtt.connect(CONFIG.remote.broker,{reconnectPeriod:3000});
    mcli.on('connect',()=>{ mcli.subscribe('claynor/'+CONFIG.remote.room+'/action'); pubRemote(); });
    mcli.on('message',(t,p)=>{ let m; try{ m=JSON.parse(p.toString()); }catch(e){ return; } const S=state.trophees;
      if(m.a==='tp'){ S.obtenus=Math.min(S.obtenus+1,S.total); commit(); fireCelebrate(); }
      else if(m.a==='tm'){ S.obtenus=Math.max(S.obtenus-1,0); commit(); }
      else if(m.a==='op'){ S.total++; commit(); }
      else if(m.a==='om'){ S.total=Math.max(S.total-1,S.obtenus); commit(); }
      else if(m.a==='game'&&m.g){ changeGame(m.g); } });
  }catch(e){} }; document.head.appendChild(s);
})();
window.setJeu=n=>changeGame(n);
window.setTrophees=(o,t)=>{ state.trophees.obtenus=o; if(t!==undefined) state.trophees.total=t; commit(); };

function psetP(v){ pdata.n=Math.max(0,v); psave(); prender(true); }

let ptTs=0; try{ const r=localStorage.getItem('hud_celebrate'); if(r) ptTs=JSON.parse(r).ts||0; }catch(e){}
function ponTrophy(p){ if(!CONFIG.platines.auto||!p||!p.ts||p.ts<=ptTs) return; ptTs=p.ts;
  if(!(p.total>0&&p.got>=p.total)) return; const s=readShared(), jeu=(s&&s.jeu)?s.jeu:'—';

try{ const b=new BroadcastChannel('hud-claynor'); b.addEventListener('message',e=>{ if(e.data&&e.data.kind==='trophy') ponTrophy(e.data); }); }catch(e){}
setInterval(()=>{ try{ const r=localStorage.getItem('hud_celebrate'); if(r) ponTrophy(JSON.parse(r)); }catch(e){} },400);
setInterval(()=>{ try{ const r=localStorage.getItem(PK); if(r){ const d=JSON.parse(r); if(d&&d.n!==pdata.n){ pdata=d; prender(true); } } }catch(e){} },800);
prender(false);

/* =====================================================================
   ALERTE
   ===================================================================== */
let actx;
function ding(kind){ if(!CONFIG.alerte.son) return;
  const S={ follow:{t:'sine',n:[[440,0],[554,.10]]}, don:{t:'triangle',n:[[587,0],[784,.10]]},
    resub:{t:'triangle',n:[[784,0],[988,.09],[1175,.18]]}, sub:{t:'sine',n:[[988,0],[1319,.09],[1760,.18]]},
    gift:{t:'triangle',n:[[784,0],[988,.11],[1175,.22],[1568,.34],[2093,.46]]},
    raid:{t:'triangle',n:[[392,0],[523,.08],[659,.16],[880,.24],[1047,.32]]},
    bits:{t:'sine',n:[[1319,0],[1760,.07],[1319,.14],[2093,.21]]} }[kind];
  if(!S) return;
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
    const now=actx.currentTime; S.n.forEach(([f,dt])=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type=S.t; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,now+dt); g.gain.exponentialRampToValueAtTime(0.16,now+dt+0.02); g.gain.exponentialRampToValueAtTime(0.0001,now+dt+0.45);
      o.connect(g).connect(actx.destination); o.start(now+dt); o.stop(now+dt+0.5); }); }catch(e){}
}
function sparks(n,cx,cy){ for(let i=0;i<n;i++){ const s=document.createElement('span'); s.className='spark';
  s.style.left=cx+'px'; s.style.top=cy+'px'; document.getElementById('scene').appendChild(s);
  const a=Math.random()*Math.PI*2, d=80+Math.random()*140;
  s.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + '+Math.cos(a)*d+'px), calc(-50% + '+Math.sin(a)*d+'px)) scale(0)',opacity:0}],{duration:800+Math.random()*600,easing:'cubic-bezier(.2,.7,.2,1)'});
  setTimeout(()=>s.remove(),1500); } }

let file=[], occupe=false;
function annoncer(a){ if(file.length>5) return; file.push(a); pomper(); }
function pomper(){ if(occupe||!file.length) return; occupe=true; const d=jouer(file.shift())||5200; setTimeout(()=>{occupe=false;pomper();}, d+500); }
function jouer(a){
  const n=NIV[a.kind]||NIV.follow;
  document.documentElement.style.setProperty('--tc',n.c); document.documentElement.style.setProperty('--td',n.d);
  const sc=document.getElementById('scene'), fly=document.getElementById('fly'), halo=document.getElementById('halo'),
        nm=document.getElementById('flyname'), pill=document.getElementById('pl'), tico=document.querySelector('#pl .tico');
  const r=tico.getBoundingClientRect(), rs=sc.getBoundingClientRect();
  const ox=r.left-rs.left+r.width/2, oy=r.top-rs.top+r.height/2;
  const sx=CX, sy=CY;                                   // arrivée : centre de la carte
  const dx=sx-ox, dy=sy-oy, taille=3.2+n.s*0.5;
  fly.style.left=ox+'px'; fly.style.top=oy+'px';
  halo.style.left=sx+'px'; halo.style.top=sy+'px';
  nm.style.left=sx+'px'; nm.style.top=(sy+CH*0.32)+'px';
  document.getElementById('fk').textContent=a.titre||n.k;
  document.getElementById('fp').textContent=a.nom||'';
  pill.classList.add('vol');
  const VOL=(CONFIG.alerte.vol||1.2)*1000, HOLD=(CONFIG.alerte.duree||3.4)*1000;
  const D=VOL*2+HOLD, o=t=>t/D, oArr=o(VOL), oFin=o(VOL+HOLD);
  const T=(tx,ty,s,rot)=>'translate(-50%,-50%) translate('+tx+'px,'+ty+'px) scale('+s+') rotateY('+rot+'deg)';
  const mx=dx*0.5-CW*0.15, my=dy*0.5;
  fly.animate([
    { offset:0,           opacity:0, transform:T(0,0,1,0),               easing:'cubic-bezier(.3,.7,.3,1)' },
    { offset:o(VOL*0.30), opacity:1, transform:T(mx,my,1.8,140),         easing:'cubic-bezier(.25,.6,.25,1)' },
    { offset:oArr,        opacity:1, transform:T(dx,dy,taille,540),       easing:'linear' },
    { offset:oFin,        opacity:1, transform:T(dx,dy,taille,720),       easing:'cubic-bezier(.4,0,.6,1)' },
    { offset:o(VOL+HOLD+VOL*0.70), opacity:1, transform:T(mx,my,1.7,1080), easing:'linear' },
    { offset:1,           opacity:0, transform:T(0,0,1,1260) }
  ],{ duration:D, easing:'linear' });
  halo.animate([
    { offset:0,opacity:0,transform:'translate(-50%,-50%) scale(.3)',easing:'ease-out' },
    { offset:oArr,opacity:.30,transform:'translate(-50%,-50%) scale(1)',easing:'linear' },
    { offset:oFin,opacity:.22,transform:'translate(-50%,-50%) scale(1.1)',easing:'ease-in' },
    { offset:1,opacity:0,transform:'translate(-50%,-50%) scale(.5)' }
  ],{ duration:D, easing:'linear' });
  nm.animate([
    { offset:0,opacity:0,transform:'translate(-50%,-50%) translateY(14px) scale(.9)',easing:'linear' },
    { offset:o(VOL+120),opacity:0,transform:'translate(-50%,-50%) translateY(14px) scale(.9)',easing:'cubic-bezier(.2,.9,.3,1)' },
    { offset:o(VOL+380),opacity:1,transform:'translate(-50%,-50%) translateY(0) scale(1)',easing:'linear' },
    { offset:o(VOL+HOLD-300),opacity:1,transform:'translate(-50%,-50%) translateY(0) scale(1)',easing:'ease-in' },
    { offset:o(VOL+HOLD-60),opacity:0,transform:'translate(-50%,-50%) translateY(-10px) scale(.96)',easing:'linear' },
    { offset:1,opacity:0,transform:'translate(-50%,-50%) translateY(-10px) scale(.96)' }
  ],{ duration:D, easing:'linear' });
  setTimeout(()=>sparks(n.s>=4?16:9,sx,sy), VOL);
  setTimeout(()=>pill.classList.remove('vol'), D-260);
  ding(a.kind);
  return D;
}

/* Streamlabs + viewers */
function connectStreamlabs(token){ if(!token||!CONFIG.alerte.actif) return; const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.0.3/socket.io.js';
  s.onload=()=>{ try{ const sl=io('https://sockets.streamlabs.com?token='+token,{transports:['websocket']});
    sl.on('event',ev=>{ if(!ev||!ev.type) return; const ms=Array.isArray(ev.message)?ev.message:[ev.message]; ms.forEach(m=>{ if(m) onEvent(ev.type,m); }); });
  }catch(e){} }; document.head.appendChild(s); }
function onEvent(type,m){ const E=CONFIG.alerte.evenements, nom=(m.name||m.from||m.gifter||'ANON');
  if(type==='follow'){ if(E.follow) annoncer({kind:'follow',nom}); }
  else if(type==='donation'){ if(E.don){ const a=m.formatted_amount||m.amount; annoncer({kind:'don',nom,titre:a?('Don · '+a):'Don'}); } }
  else if(type==='raid'||type==='host'){ if(E.raid) annoncer({kind:'raid',nom,titre:(type==='raid'?'Raid · ':'Host · ')+(m.raiders||m.viewers||0)+' viewers'}); }
  else if(type==='bits'){ if(E.bits) annoncer({kind:'bits',nom,titre:(parseInt(m.amount,10)||0)+' bits'}); }
  else if(type==='subscription'||type==='resub'){ if(!E.sub) return; const st=(m.sub_type||'').toLowerCase();
    if(st==='subgift'||st==='anonsubgift') annoncer({kind:'gift',nom:(m.gifter||nom)});
    else if(st==='submysterygift') annoncer({kind:'gift',nom:(m.gifter||nom),titre:'Subs offerts ×'+(m.amount||1)});
    else if(st==='resub'||(m.months&&m.months>1)) annoncer({kind:'resub',nom,titre:'Resub · '+(m.months||1)+' mois'});
    else annoncer({kind:'sub',nom}); } }
connectStreamlabs((new URLSearchParams(location.search).get('token'))||CONFIG.alerte.streamlabs.token);

let lastN=null;
function showViewers(n){ const b=document.getElementById('vw'), el=document.getElementById('vn');
  if(!n){ hideViewers(); return; }
  el.textContent=n.toLocaleString('fr-FR'); b.classList.add('on');
  if(lastN!==null&&n!==lastN){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } lastN=n; }
function hideViewers(){ document.getElementById('vw').classList.remove('on'); lastN=null; }
async function pollViewers(){ if(!CONFIG.twitch){ hideViewers(); return; }
  try{ const r=await fetch('https://decapi.me/twitch/viewercount/'+encodeURIComponent(CONFIG.twitch)+'?_='+Date.now(),{cache:'no-store'});
    const t=(await r.text()).trim(); if(/^\d+$/.test(t)) showViewers(parseInt(t,10)); else if(CONFIG.apercu) showViewers(42); else hideViewers();
  }catch(e){ if(CONFIG.apercu) showViewers(42); else hideViewers(); } }
pollViewers(); setInterval(pollViewers, Math.max(15,CONFIG.refresh)*1000);
